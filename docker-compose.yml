version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      - MONGODB_URI=mongodb://mongo:27017/focusflow
      - JWT_SECRET=change_this
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
