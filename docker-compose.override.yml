version: '3.8'
services:
  backend:
    build:
      context: ./backend
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - JWT_SECRET=dev_secret
    volumes:
      - ./backend:/app
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:80'
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
